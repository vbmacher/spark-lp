<svg xmlns="http://www.w3.org/2000/svg" width="880" height="449" viewBox="0 0 880 449" role="img" aria-labelledby="title desc">
  <title id="title">Spark LP 2.2.0 local LP peak memory</title>
  <desc id="desc">Well-conditioned, 1,000 rows and 10,000 variables, Cholesky: 3.82 GiB. Well-conditioned, 1,000 rows and 10,000 variables, CG: 3.84 GiB. Well-conditioned, 5,000 rows and 50,000 variables, Cholesky: 4.24 GiB. Well-conditioned, 5,000 rows and 50,000 variables, CG: 3.99 GiB. Widely scaled, 5,000 rows and 50,000 variables, Cholesky: 3.90 GiB. Widely scaled, 5,000 rows and 50,000 variables, CG: 3.78 GiB. Nearly dependent, 5,000 rows and 50,000 variables, Cholesky: 4.02 GiB. Nearly dependent, 5,000 rows and 50,000 variables, CG: No memory result after timeout. RSS is resident set size.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #24344a; }
    .title { font-size: 23px; font-weight: 700; }
    .detail { font-size: 14px; fill: #526276; }
    .axis-label { font-size: 15px; font-weight: 700; }
    .tick { font-size: 14px; text-anchor: middle; }
    .grid { fill: none; stroke: #dce3eb; }
    .axis { fill: none; stroke: #77879a; }
    .cholesky { fill: #2463a8; }
    .cg { fill: #a74718; }
  </style>
  <rect width="880" height="449" rx="8" fill="#fff"/>
  <text x="29" y="36" class="title">Spark LP 2.2.0 local LP peak memory</text>
  <text x="29" y="62" class="detail">November 20, 2026 · Spark 3.5.6 · 4 local threads · 8 partitions · 4 GiB heap · native LAPACK</text>
  <text x="29" y="88" class="detail">Peaks include preparation and warmup.</text>
  <rect x="619" y="78" width="10" height="10" class="cholesky"/>
