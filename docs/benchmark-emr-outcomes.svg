<svg xmlns="http://www.w3.org/2000/svg" width="880" height="309" viewBox="0 0 880 309" role="img" aria-labelledby="title desc">
  <title id="title">EMR outcomes for generated LPs</title>
  <desc id="desc">Of the same 100 generated LP benchmark cases per solver, CG validated 90 and left 10 incomplete. Cholesky validated 82, ran out of heap on 12, and was excluded for memory on 6.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #24344a; }
    .title { font-size: 23px; font-weight: 700; }
    .detail { font-size: 14px; fill: #526276; }
    .axis-label { font-size: 15px; font-weight: 700; }
    .tick { font-size: 14px; text-anchor: middle; }
    .grid { fill: none; stroke: #dce3eb; }
    .axis { fill: none; stroke: #77879a; }
    .validated { fill: #2463a8; }
    .incomplete { fill: #ecb46a; }
    .oom { fill: #98374f; }
    .excluded { fill: #dce3eb; }
    .count { font-weight: 700; text-anchor: middle; }
    .on-dark { fill: #fff; }
  </style>
  <rect width="880" height="309" rx="8" fill="#fff"/>
  <text x="29" y="36" class="title">EMR outcomes for generated LPs</text>
  <text x="29" y="62" class="detail">September 15–16, 2026 · same 100 generated LP benchmark cases per solver</text>
  <rect x="188" y="86" width="10" height="10" class="validated"/>
  <text x="205" y="96">Validated</text>
  <rect x="331" y="86" width="10" height="10" class="incomplete"/>
  <text x="348" y="96">Incomplete</text>
  <rect x="475" y="86" width="10" height="10" class="oom"/>
  <text x="492" y="96">Heap OOM</text>
  <rect x="620" y="86" width="10" height="10" class="excluded"/>
  <text x="637" y="96">Resource-excluded</text>
  <path d="M188 121V240 M347.5 121V240 M507 121V240 M666.5 121V240 M826 121V240" class="grid"/>
  <path d="M188 121V240H826" class="axis"/>
  <text x="24" y="181" class="axis-label" text-anchor="middle" transform="rotate(-90 24 181)">Solver backend</text>
  <text x="188" y="262" class="tick">0</text>
  <text x="347.5" y="262" class="tick">25</text>
  <text x="507" y="262" class="tick">50</text>
  <text x="666.5" y="262" class="tick">75</text>
  <text x="826" y="262" class="tick">100</text>
  <text x="507" y="289" class="axis-label" text-anchor="middle">Number of LP benchmark cases</text>
  <text x="60" y="157">CG</text>
  <g aria-label="CG, Validated, 90 LP benchmark cases">
    <rect x="188" y="134" width="574.2" height="34" class="validated"/>
    <text x="475.1" y="157" class="count on-dark">90</text>
  </g>
  <g aria-label="CG, Incomplete, 10 LP benchmark cases">
    <rect x="762.2" y="134" width="63.8" height="34" class="incomplete"/>
    <text x="794.1" y="157" class="count">10</text>
  </g>
  <text x="60" y="215">Cholesky</text>
  <g aria-label="Cholesky, Validated, 82 LP benchmark cases">
    <rect x="188" y="192" width="523.16" height="34" class="validated"/>
    <text x="449.58" y="215" class="count on-dark">82</text>
  </g>
  <g aria-label="Cholesky, Heap OOM, 12 LP benchmark cases">
    <rect x="711.16" y="192" width="76.56" height="34" class="oom"/>
    <text x="749.44" y="215" class="count on-dark">12</text>
  </g>
  <g aria-label="Cholesky, Resource-excluded, 6 LP benchmark cases">
    <rect x="787.72" y="192" width="38.28" height="34" class="excluded"/>
    <text x="806.86" y="215" class="count">6</text>
  </g>
</svg>
