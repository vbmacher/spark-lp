  <rect x="751" y="78" width="10" height="10" class="cg"/>
  <text x="768" y="88">CG</text>
  <path d="M300 122V382 M402.2 122V382 M504.4 122V382 M606.6 122V382 M708.8 122V382 M811 122V382" class="grid"/>
  <path d="M300 122V382H811" class="axis"/>
  <text x="24" y="252" class="axis-label" text-anchor="middle" transform="rotate(-90 24 252)">LP workload</text>
  <text x="300" y="405" class="tick">0</text>
